<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raghav Kulkarni | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Inter:wght@200;400;500&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #0a0a0a; --card-bg: #111111; --text: #ffffff; --dim: #999; --border: rgba(255,255,255,0.15); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png"); }
        
        /* --- HERO --- */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hero-logo img { width: 280px; height: auto; }
        .scroll-hint { margin-top: 30px; font-family: 'Montserrat', sans-serif; font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; color: var(--dim); animation: bounce 2s infinite; }

        /* --- BACK BUTTON --- */
        #backBtn { position: fixed; top: 30px; left: 5%; z-index: 2000; display: none; background: rgba(10,10,10,0.9); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; font-family: 'Montserrat', sans-serif; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px); }
        #backBtn:hover { background: #fff; color: #000; }

        /* --- BENTO CONTAINER --- */
        .bento-container { padding: 0 5% 100px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 1px solid var(--border); overflow: hidden; position: relative; }
        .about-card { grid-column: span 4; display: grid; grid-template-columns: 0.8fr 1.2fr; min-height: 450px; margin-bottom: 20px; }
        .about-photo { width: 100%; height: 100%; overflow: hidden; }
        .about-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: 1s ease; }
        .about-text { padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .about-text h2 { font-family: 'Montserrat', sans-serif; font-size: clamp(1.4rem, 4vw, 2.5rem); font-weight: 600; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; }
        .about-text p { font-size: 0.95rem; line-height: 1.8; font-weight: 300; color: #ccc; margin-bottom: 15px; }

        .category-card { grid-column: span 1; height: 65vh; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 40px; }
        .category-card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); }
        .category-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%); z-index: 1; }
        .category-card h3 { position: relative; z-index: 2; text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 5px; width: 100%; }

        /* --- GALLERY & VIDEOS --- */
        .gallery-container { padding: 120px 5% 100px; display: none; }
        .gallery-container.active { display: block; animation: fadeIn 0.8s forwards; }
        .pinterest-grid { column-count: 3; column-gap: 25px; }
        .art-item { break-inside: avoid; margin-bottom: 25px; cursor: pointer; }
        .art-item img { width: 100%; height: auto; border: 1px solid var(--border); transition: 0.4s; }

        .video-stack { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
        .video-item { width: 100%; max-width: 800px; position: relative; border: 1px solid var(--border); background: #000; overflow: hidden; }
        .video-item.is-short { max-width: 350px; aspect-ratio: 9/16; }
        .video-item iframe { width: 100%; height: 100%; aspect-ratio: 16/9; pointer-events: none; } 
        .video-item.is-short iframe { aspect-ratio: 9/16; }

        /* Click overlay to unmute */
        .unmute-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; display: flex; align-items: flex-end; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.4)); transition: 0.3s; }
        .unmute-overlay span { font-family: 'Montserrat'; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); }
        .video-item.playing .unmute-overlay { opacity: 0; pointer-events: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-10px);} }

        @media (max-width: 900px) {
            .bento-container { grid-template-columns: 1fr 1fr; }
            .about-card { grid-column: span 2; display: block; }
            .pinterest-grid { column-count: 2; }
        }
    </style>
</head>
<body>

    <button id="backBtn" onclick="goHome()">← Back</button>

    <section class="hero" id="hero">
        <div class="hero-logo"><img src="logo.png" alt="Raghav Kulkarni"></div>
        <div class="scroll-hint">Scroll to Explore</div>
    </section>

    <main class="bento-container" id="bentoWrapper">
        <section class="card about-card">
            <div class="about-photo"><img src="profile.jpg" alt="Raghav Kulkarni"></div>
            <div class="about-text">
                <h2>Raghav Kulkarni</h2>
                <p>Commercial photographer and cinematographer specializing in high-end product media and architectural interiors.</p>
                <p>Based in Pune, I deliver technical excellence and conceptual clarity.</p>
            </div>
        </section>

        <div class="card category-card" onclick="loadCategory('product')">
            <img src="thumb-product.webp" alt="Product">
            <h3>Product</h3>
        </div>
        <div class="card category-card" onclick="loadCategory('interior')">
            <img src="thumb-interior.webp" alt="Interior">
            <h3>Interior</h3>
        </div>
        <div class="card category-card" onclick="loadCategory('corporate')">
            <img src="thumb-corporate.webp" alt="Corporate">
            <h3>Corporate</h3>
        </div>
        <div class="card category-card" onclick="loadCategory('videos')">
            <img src="thumb-commercial.webp" alt="Videos">
            <h3>Videos</h3>
        </div>
    </main>

    <div id="gallery" class="gallery-container">
        <div id="contentWrapper"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const videoData = [
            {id: 'fm0evRNFji0', type: 0},
            {id: 'FvxT5vOnXpc', type: 0},
            {id: 'KNQVN4_M2og', type: 1},
            {id: 'i3lyAq1bj_c', type: 1},
            {id: 'JoVjSThS46U', type: 1}
        ];

        let players = {};

        function onYouTubeIframeAPIReady() {
            // API global callback
        }

        function loadCategory(cat) {
            document.getElementById('bentoWrapper').style.display = 'none';
            document.getElementById('hero').style.display = 'none';
            document.getElementById('backBtn').style.display = 'block';
            const wrapper = document.getElementById('contentWrapper');
            document.getElementById('gallery').classList.add('active');
            wrapper.innerHTML = '';

            if (cat === 'videos') {
                const stack = document.createElement('div');
                stack.className = 'video-stack';
                
                videoData.forEach((video, index) => {
                    const divId = `player-${index}`;
                    const item = document.createElement('div');
                    item.className = video.type === 1 ? 'video-item is-short' : 'video-item';
                    item.innerHTML = `
                        <div class="unmute-overlay" onclick="unmuteVideo('${divId}', this)">
                            <span>Click for Sound</span>
                        </div>
                        <div id="${divId}"></div>
                    `;
                    stack.appendChild(item);
                    
                    setTimeout(() => {
                        players[divId] = new YT.Player(divId, {
                            videoId: video.id,
                            playerVars: { 
                                'autoplay': 1, 
                                'mute': 1, 
                                'controls': 0,
                                'modestbranding': 1,
                                'rel': 0,
                                'origin': window.location.origin
                            },
                            events: {
                                'onReady': (e) => {
                                    e.target.playVideo();
                                },
                                'onStateChange': (e) => {
                                    // Robust programmatic loop handling to prevent player validation crashes
                                    if (e.data === YT.PlayerState.ENDED) {
                                        e.target.seekTo(0);
                                        e.target.playVideo();
                                    }
                                }
                            }
                        });
                    }, 100);
                });
                wrapper.appendChild(stack);
            } else {
                const grid = document.createElement('div');
                grid.className = 'pinterest-grid';
                const imgs = { product: 22, interior: 16, corporate: 6 };
                for(let i=1; i<=imgs[cat]; i++) {
                    grid.innerHTML += `<div class="art-item"><img src="${cat}${i}.webp" onclick="openFullscreen(this.src)"></div>`;
                }
                wrapper.appendChild(grid);
            }
            window.scrollTo(0,0);
        }

        function unmuteVideo(divId, overlay) {
            const player = players[divId];
            if (player) {
                player.unMute();
                player.setVolume(100);
                player.seekTo(0); 
                player.playVideo();
                overlay.parentElement.classList.add('playing');
            }
        }

        function goHome() {
            Object.values(players).forEach(p => { if(p && typeof p.destroy === 'function') p.destroy(); });
            players = {};
            
            document.getElementById('gallery').classList.remove('active');
            document.getElementById('bentoWrapper').style.display = 'grid';
            document.getElementById('hero').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
            window.scrollTo(0,0);
        }

        function openFullscreen(src) {
            const viewer = document.createElement('div');
            viewer.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:5000; display:flex; align-items:center; justify-content:center; cursor:zoom-out;";
            viewer.innerHTML = `<img src="${src}" style="max-width:90%; max-height:90%; border: 1px solid var(--border);">`;
            viewer.onclick = () => viewer.remove();
            document.body.appendChild(viewer);
        }
    </script>
</body>
</html>
