<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raghav Kulkarni | Visual Artist</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #00638C;
            --text-main: #111;
            --bg-color: #ffffff;
            --ease: cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* HIDE DEFAULT CURSOR */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- 1. CUSTOM CURSOR --- */
        .cursor {
            position: fixed; top: 0; left: 0; width: 20px; height: 20px;
            background: var(--brand-blue); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.3s, height 0.3s;
        }
        body.hovering .cursor { width: 80px; height: 80px; opacity: 0.5; }

        /* --- 2. HOVER REVEAL (Floating Image) --- */
        .hover-reveal {
            position: fixed; top: 0; left: 0; width: 350px; height: 450px;
            pointer-events: none; z-index: 1;
            opacity: 0; transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.3s, transform 0.6s var(--ease);
            overflow: hidden; border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .hover-reveal img { width: 100%; height: 100%; object-fit: cover; }
        .hover-reveal.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* --- 3. LANDING MENU --- */
        .menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #fff; z-index: 10;
            transition: transform 1s var(--ease);
        }
        .menu-screen.slide-up { transform: translateY(-100%); }

        .brand-name {
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; 
            margin-bottom: 50px; letter-spacing: 1px; text-transform: uppercase;
        }

        .menu-list { list-style: none; text-align: center; }
        .menu-item {
            font-family: 'Syne', sans-serif; font-weight: 700;
            font-size: 5vw; line-height: 1.1;
            cursor: pointer; color: #ddd;
            transition: color 0.3s, transform 0.3s;
            position: relative; z-index: 5;
        }
        .menu-item:hover { color: #111; transform: scale(1.02); }
        
        @media (max-width: 768px) { .menu-item { font-size: 3rem; } }

        /* --- 4. GALLERY FEED --- */
        .gallery-feed {
            min-height: 100vh; padding: 120px 5% 50px;
            opacity: 0; transition: opacity 0.5s ease 0.5s;
        }
        .gallery-feed.visible { opacity: 1; }

        /* FILLED BUTTON (Updated) */
        .back-nav {
            position: fixed; top: 30px; left: 40px; z-index: 50;
            background: var(--brand-blue); color: #fff;
            padding: 12px 30px; border-radius: 50px; /* Pill Shape */
            font-weight: 600; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; display: none;
            box-shadow: 0 5px 20px rgba(0, 99, 140, 0.3);
            transition: transform 0.3s;
        }
        .back-nav:hover { transform: translateY(-3px); }

        /* MASONRY GRID */
        .masonry-grid { column-count: 3; column-gap: 30px; }
        .grid-item {
            break-inside: avoid; margin-bottom: 30px;
            opacity: 0; transform: translateY(50px);
            transition: all 0.8s var(--ease);
        }
        .grid-item.visible { opacity: 1; transform: translateY(0); }
        .grid-item img {
            width: 100%; height: auto; display: block; border-radius: 6px;
            cursor: pointer; transition: filter 0.3s;
        }
        .grid-item:hover img { filter: brightness(0.8); }

        /* --- 5. SWIPEABLE LIGHTBOX (Updated) --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        
        /* Image Container to hold arrows and image */
        .lb-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        
        .lightbox img { 
            max-width: 90%; max-height: 85%; object-fit: contain; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* Controls */
        .lb-close { position: absolute; top: 30px; right: 40px; color: #fff; font-weight: 600; cursor: pointer; z-index: 102; font-family: 'Syne'; letter-spacing: 1px;}
        
        .lb-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.1); color: #fff;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.3s; z-index: 102;
            font-size: 1.5rem;
        }
        .lb-arrow:hover { background: var(--brand-blue); }
        .lb-prev { left: 30px; }
        .lb-next { right: 30px; }

        .lb-counter {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #666; font-family: 'Syne'; font-size: 0.9rem;
        }

        @media (max-width: 768px) { 
            .masonry-grid { column-count: 1; } 
            .lb-arrow { display: none; } /* Hide arrows on mobile, use swipe */
        }

        .loader { position: fixed; bottom: 30px; right: 30px; width: 25px; height: 25px; border: 3px solid #eee; border-top: 3px solid var(--brand-blue); border-radius: 50%; animation: spin 1s infinite linear; display: none; z-index: 200; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <div class="hover-reveal" id="revealBox">
        <img src="" id="revealImg">
    </div>

    <div class="menu-screen" id="menuScreen">
        <div class="brand-name">RAGHAV KULKARNI</div>
        
        <ul class="menu-list">
            <li class="menu-item" 
                onmouseenter="showPreview('product1.webp')" 
                onmouseleave="hidePreview()"
                onclick="openGallery('product')">
                Product & Jewelry
            </li>
            <li class="menu-item" 
                onmouseenter="showPreview('interior1.webp')" 
                onmouseleave="hidePreview()"
                onclick="openGallery('interior')">
                Interior Media
            </li>
            <li class="menu-item" 
                onmouseenter="showPreview('corporate1.webp')" 
                onmouseleave="hidePreview()"
                onclick="openGallery('corporate')">
                Corporate Work
            </li>
        </ul>
    </div>

    <div class="back-nav" id="backBtn" onclick="goHome()">BACK TO MENU</div>
    
    <div class="gallery-feed" id="galleryFeed">
        <div class="masonry-grid" id="grid"></div>
    </div>

    <div class="loader" id="loader"></div>

    <div class="lightbox" id="lightbox">
        <div class="lb-close" onclick="closeLightbox()">CLOSE</div>
        
        <div class="lb-container" id="lbTouchArea">
            <div class="lb-arrow lb-prev" onclick="changeSlide(-1)">&#8249;</div>
            <img src="" id="lbImg">
            <div class="lb-arrow lb-next" onclick="changeSlide(1)">&#8250;</div>
        </div>

        <div class="lb-counter" id="lbCounter">1 / 10</div>
    </div>

    <script>
        // --- DATA ---
        function generatePaths(prefix, count) {
            var paths = [];
            for (var i = 1; i <= count; i++) { paths.push(prefix + i + ".webp"); }
            return paths;
        }
        const portfolioData = {
            product: generatePaths('product', 22),   
            interior: generatePaths('interior', 12), 
            corporate: generatePaths('corporate', 6) 
        };

        // --- STATE ---
        let currentGalleryImages = [];
        let currentLightboxIndex = 0;

        // --- 1. CURSOR & HOVER REVEAL ---
        const cursor = document.getElementById('cursor');
        const revealBox = document.getElementById('revealBox');
        const revealImg = document.getElementById('revealImg');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            revealBox.style.left = e.clientX + 'px';
            revealBox.style.top = e.clientY + 'px';
        });

        function showPreview(imgSrc) {
            revealImg.src = imgSrc;
            revealBox.classList.add('active');
            cursor.style.width = '80px'; cursor.style.height = '80px'; cursor.style.opacity = '0.2';
        }

        function hidePreview() {
            revealBox.classList.remove('active');
            cursor.style.width = '20px'; cursor.style.height = '20px'; cursor.style.opacity = '1';
        }

        // --- 2. OPEN GALLERY ---
        function openGallery(category) {
            document.getElementById('menuScreen').classList.add('slide-up');
            document.getElementById('backBtn').style.display = 'block';

            const grid = document.getElementById('grid');
            const feed = document.getElementById('galleryFeed');
            const loader = document.getElementById('loader');
            
            grid.innerHTML = '';
            feed.classList.add('visible');
            loader.style.display = 'block';

            // Store current images for Lightbox
            currentGalleryImages = portfolioData[category];
            let loadedCount = 0;

            currentGalleryImages.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'grid-item';
                
                const img = new Image();
                img.src = url;
                img.loading = "lazy";
                
                img.onload = () => {
                    loadedCount++;
                    div.classList.add('visible');
                    if(loadedCount > 2) loader.style.display = 'none';
                };
                
                // Pass the index (i) to openLightbox
                img.onclick = () => openLightbox(i);

                div.appendChild(img);
                grid.appendChild(div);
            });
        }

        function goHome() {
            document.getElementById('menuScreen').classList.remove('slide-up');
            document.getElementById('galleryFeed').classList.remove('visible');
            document.getElementById('backBtn').style.display = 'none';
            window.scrollTo(0,0);
        }

        // --- 3. SWIPEABLE LIGHTBOX LOGIC ---
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightbox();
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function changeSlide(direction) {
            // Direction: -1 (prev) or 1 (next)
            currentLightboxIndex += direction;
            
            // Loop logic
            if (currentLightboxIndex < 0) currentLightboxIndex = currentGalleryImages.length - 1;
            if (currentLightboxIndex >= currentGalleryImages.length) currentLightboxIndex = 0;
            
            updateLightbox();
        }

        function updateLightbox() {
            const lbImg = document.getElementById('lbImg');
            const counter = document.getElementById('lbCounter');
            
            // Fade effect could be added here
            lbImg.src = currentGalleryImages[currentLightboxIndex];
            counter.innerText = (currentLightboxIndex + 1) + " / " + currentGalleryImages.length;
        }

        // KEYBOARD NAVIGATION
        document.addEventListener('keydown', (e) => {
            if(document.getElementById('lightbox').style.display === 'flex') {
                if(e.key === 'ArrowRight') changeSlide(1);
                if(e.key === 'ArrowLeft') changeSlide(-1);
                if(e.key === 'Escape') closeLightbox();
            }
        });

        // --- 4. TOUCH SWIPE LOGIC ---
        let touchStartX = 0;
        let touchEndX = 0;
        const lbTouchArea = document.getElementById('lbTouchArea');

        lbTouchArea.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        lbTouchArea.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            // Threshold for swipe
            if (touchStartX - touchEndX > 50) {
                // Swiped Left -> Next
                changeSlide(1);
            }
            if (touchEndX - touchStartX > 50) {
                // Swiped Right -> Prev
                changeSlide(-1);
            }
        }

        // --- 5. HOVER EFFECTS ---
        document.querySelectorAll('a, button, .menu-item, .grid-item, .back-nav').forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
        });

    </script>
</body>
</html>
