<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raghav Kulkarni | The Folio</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #00638C;
            --book-w: 440px;
            --book-h: 620px;
            --ease: cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background: #1a1a1a;
        }

        /* --- 1. THE ENVIRONMENT --- */
        .environment {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transition: all 1.2s var(--ease);
            /* Wood Table Look */
            background: #2c241b;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 10px);
            box-shadow: inset 0 0 200px #000;
        }
        
        body.reading-mode .environment {
            /* Studio Grey Look */
            background: #e6e6e6;
            transform: scale(1.1);
        }

        /* --- 2. 3D SCENE --- */
        .scene {
            width: var(--book-w); height: var(--book-h);
            perspective: 2500px; z-index: 10;
            transition: transform 1.2s var(--ease);
        }
        
        /* Resting Angle */
        .scene.resting { transform: rotateX(35deg) rotateZ(-5deg) scale(0.85); cursor: pointer; }
        .scene.resting:hover { transform: rotateX(30deg) rotateZ(-3deg) scale(0.9) translateY(-20px); }
        
        /* Active Angle (Reading) */
        .scene.active { transform: rotateX(0deg) rotateZ(0deg) translateX(220px); /* Shift right to center spread */ }

        .book {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
        }

        /* --- 3. PAGES --- */
        .page {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            transform-origin: left center; transform-style: preserve-3d;
            transition: transform 0.8s var(--ease);
            background: #fff; border-radius: 2px 5px 5px 2px;
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.05), 5px 5px 15px rgba(0,0,0,0.1);
        }
        .page.flipped { transform: rotateY(-180deg); }
        
        .front, .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; overflow: hidden;
        }
        .back { transform: rotateY(180deg); background: #fdfdfd; }

        /* COVER DESIGN */
        #cover {
            background: #111; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-left: 8px solid #333; /* Spine */
            /* Leather Texture */
            background-image: url("data:image/svg+xml,%3Csvg width='4' height='4' viewBox='0 0 4 4' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 3h1v1H1V3zm2-2h1v1H3V1z' fill='%23333' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .logo-box { padding: 20px; border: 1px solid rgba(255,255,255,0.3); margin-bottom: 30px; }

        /* LEFT PAGE (Static Info) */
        .static-left-content {
            padding: 50px 40px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .info-block h3 { font-family: 'Playfair Display'; font-size: 1.5rem; margin-bottom: 10px; color: var(--brand-blue); }
        .info-block p { font-size: 0.9rem; color: #666; line-height: 1.6; }
        .info-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #aaa; margin-bottom: 5px; margin-top: 20px;}

        /* RIGHT PAGE (Photos) */
        .photo-wrapper { width: 100%; height: 100%; padding: 30px; display: flex; justify-content: center; align-items: center; }
        .photo-img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
        }

        /* --- 4. INDEX TABS (The "Organizer" Look) --- */
        .tabs-container {
            position: absolute; right: -40px; top: 50px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 5; /* Behind pages initially */
            transform-style: preserve-3d;
            opacity: 0; transition: opacity 0.5s;
        }
        body.reading-mode .tabs-container { opacity: 1; }

        .tab {
            width: 50px; height: 40px; background: #fff;
            border-radius: 0 5px 5px 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: flex; justify-content: center; align-items: center;
            font-size: 0.7rem; font-weight: 600; color: #999;
            cursor: pointer; transition: width 0.3s, background 0.3s;
        }
        .tab:hover { width: 60px; color: var(--brand-blue); }
        .tab.active { background: var(--brand-blue); color: #fff; width: 65px; }

        /* --- CONTROLS --- */
        .controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 200; opacity: 0; pointer-events: none; transition: 1s;
        }
        body.reading-mode .controls { opacity: 1; pointer-events: auto; }
        .btn-round { width: 50px; height: 50px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; color: var(--brand-blue); }

        /* --- UTILS --- */
        @media (max-width: 900px) {
            :root { --book-w: 320px; --book-h: 480px; }
            .scene.active { transform: translateX(0); }
            .page.flipped { opacity: 0; pointer-events: none; } /* Mobile optimization */
            .tabs-container { display: none; } /* Hide tabs on mobile */
        }
    </style>
</head>
<body>

    <div class="environment"></div>

    <div class="scene resting" id="bookScene" onclick="openBook()">
        <div class="book">
            
            <div class="tabs-container">
                <div class="tab" onclick="jumpToCategory('product', this)">PROD</div>
                <div class="tab" onclick="jumpToCategory('interior', this)">INTR</div>
                <div class="tab" onclick="jumpToCategory('corporate', this)">CORP</div>
            </div>

            <div class="page" id="page-cover" style="z-index: 100;">
                <div class="front" id="cover">
                    <div class="logo-box">
                        <img src="logo.png" style="width: 150px; filter: invert(1);">
                    </div>
                    <h1 style="font-family:'Playfair Display'; font-size:1.5rem; letter-spacing:2px;">RAGHAV KULKARNI</h1>
                    <p style="font-size:0.8rem; color:#888; margin-top:10px;">VOL. 2025</p>
                    <div style="margin-top:40px; font-size:0.7rem; letter-spacing:2px; color:#666;">TAP TO VIEW</div>
                </div>
                
                <div class="back">
                    <div class="static-left-content">
                        <div id="dynamic-info">
                            <div class="info-label">Current Section</div>
                            <h3 id="info-title">Introduction</h3>
                            <div class="info-label">Description</div>
                            <p id="info-desc">
                                Welcome to my portfolio. This collection highlights my work in commercial, interior, and product photography.
                            </p>
                        </div>

                        <div>
                            <div style="width: 50px; height: 1px; background: #ddd; margin: 20px 0;"></div>
                            <div style="font-size:0.8rem; font-weight:600;">Raghav Kulkarni</div>
                            <div style="font-size:0.75rem; color:#888;">Visual Artist</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="pagesStack"></div>

        </div>
    </div>

    <div class="controls">
        <button class="btn-round" onclick="prevPage()">&#8592;</button>
        <button class="btn-round" onclick="nextPage()">&#8594;</button>
    </div>

    <script>
        // --- DATA ---
        function generatePaths(prefix, count) {
            var paths = [];
            for (var i = 1; i <= count; i++) { paths.push(prefix + i + ".webp"); }
            return paths;
        }
        
        // Metadata for the "Smart" Left Page
        const categoryInfo = {
            product: {
                title: "Product & Jewelry",
                desc: "Precision lighting and macro details. Showcasing textures, reflections, and the intricate craftsmanship of high-end jewelry."
            },
            interior: {
                title: "Interior Media",
                desc: "Capturing the soul of a space. Balancing ambient and artificial light to highlight architectural lines and design aesthetics."
            },
            corporate: {
                title: "Corporate Work",
                desc: "Professional branding and event coverage. Creating a visual narrative that aligns with corporate identity and values."
            }
        };

        const portfolioData = {
            product: generatePaths('product', 22),   
            interior: generatePaths('interior', 12), 
            corporate: generatePaths('corporate', 6) 
        };

        // --- STATE ---
        let isBookOpen = false;
        let currentCat = null;
        let currentPageIndex = -1; // -1 = Cover
        let totalPages = 0;

        // --- 1. OPEN BOOK ---
        function openBook() {
            if(isBookOpen) return;
            isBookOpen = true;

            document.body.classList.add('reading-mode');
            const scene = document.getElementById('bookScene');
            scene.classList.remove('resting');
            scene.classList.add('active');

            // Delay cover flip for effect
            setTimeout(() => {
                document.getElementById('page-cover').classList.add('flipped');
                // Load default category
                jumpToCategory('product', document.querySelector('.tab')); 
            }, 800);
        }

        // --- 2. LOAD CATEGORY ---
        function jumpToCategory(cat, tabBtn) {
            if(!isBookOpen) return; // Prevent clicking tabs when closed

            // Update Tabs UI
            if(tabBtn) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tabBtn.classList.add('active');
            }

            // Update Left Page Text (The "Smart" Feature)
            const info = categoryInfo[cat];
            document.getElementById('info-title').innerText = info.title;
            document.getElementById('info-desc').innerText = info.desc;

            // Generate Pages
            const images = portfolioData[cat];
            const container = document.getElementById('pagesStack');
            container.innerHTML = '';
            
            totalPages = images.length;
            currentPageIndex = 0; // Reset photo index

            // Create pages (Reverse order for Z-stacking)
            for(let i = images.length - 1; i >= 0; i--) {
                const page = document.createElement('div');
                page.className = 'page';
                page.id = 'photo-' + i;
                page.style.zIndex = 50 - i; 
                
                page.innerHTML = `
                    <div class="front">
                        <div class="photo-wrapper">
                            <img src="${images[i]}" class="photo-img">
                        </div>
                    </div>
                    <div class="back" style="background:#f8f8f8;"></div>
                `;
                container.appendChild(page);
            }
        }

        // --- 3. NAVIGATION ---
        function nextPage() {
            if(currentPageIndex < totalPages - 1) {
                const p = document.getElementById('photo-' + currentPageIndex);
                if(p) {
                    p.classList.add('flipped');
                    currentPageIndex++;
                }
            }
        }

        function prevPage() {
            if(currentPageIndex > 0) {
                currentPageIndex--;
                const p = document.getElementById('photo-' + currentPageIndex);
                if(p) {
                    p.classList.remove('flipped');
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.key === "ArrowRight") nextPage();
            if(e.key === "ArrowLeft") prevPage();
        });

    </script>
</body>
</html>
