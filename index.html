<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raghav Kulkarni | Cinematic Portfolio</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #00638C;
            --text-main: #111111;
            --bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden; /* No scrolling allowed */
            height: 100vh;
            width: 100vw;
        }

        /* --- 1. NAVBAR --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; 
            padding: 30px 40px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .nav-logo-img { height: 40px; width: auto; cursor: pointer; }
        .nav-about { font-weight: 500; cursor: pointer; letter-spacing: 1px; font-size: 0.9rem; }

        /* --- 2. CATEGORY SELECTOR (Bottom Left) --- */
        .category-menu {
            position: fixed; bottom: 40px; left: 40px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 100;
        }
        .cat-btn {
            background: none; border: none; text-align: left;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; color: #999;
            cursor: pointer; transition: color 0.3s;
        }
        .cat-btn:hover { color: var(--brand-blue); }
        .cat-btn.active { color: var(--text-main); font-weight: 600; padding-left: 10px; border-left: 2px solid var(--brand-blue); }

        /* --- 3. THE STAGE (Full Screen Slider) --- */
        .slider-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.5s ease;
        }
        .slider-container.visible { opacity: 1; }

        .slide-image {
            max-width: 85vw; max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            opacity: 0; transform: scale(0.95);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .slide-image.active { opacity: 1; transform: scale(1); }

        /* --- CONTROLS (Right Side) --- */
        .controls {
            position: fixed; bottom: 40px; right: 40px;
            display: flex; gap: 20px; align-items: center;
            z-index: 100;
        }
        .counter { font-family: 'Playfair Display', serif; font-size: 1.2rem; min-width: 60px; text-align: center; }
        
        .arrow-btn {
            width: 50px; height: 50px; border: 1px solid #ddd; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s; background: #fff;
        }
        .arrow-btn:hover { border-color: var(--text-main); background: var(--text-main); color: #fff; }

        /* --- LOADING SPINNER --- */
        #loader {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border: 3px solid #f3f3f3; 
            border-top: 3px solid var(--brand-blue); border-radius: 50%;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- ABOUT OVERLAY --- */
        .about-overlay {
            position: fixed; top: 0; right: -100%; width: 500px; height: 100%;
            background: #fff; z-index: 200; padding: 60px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            transition: right 0.5s ease;
            display: flex; flex-direction: column; justify-content: center;
        }
        .about-overlay.open { right: 0; }
        .close-btn { position: absolute; top: 30px; right: 30px; cursor: pointer; font-weight: 600; letter-spacing: 1px; font-size: 0.8rem; }

        @media (max-width: 768px) {
            nav { padding: 20px; }
            .category-menu { top: 80px; bottom: auto; left: 20px; flex-direction: row; gap: 15px; }
            .cat-btn { font-size: 0.8rem; }
            .slide-image { max-width: 90vw; max-height: 60vh; }
            .controls { bottom: 30px; right: 50%; transform: translateX(50%); width: 100%; justify-content: center; }
            .about-overlay { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <img src="cornerlogo.png" alt="R" class="nav-logo-img" onclick="location.reload()">
        <div class="nav-about" onclick="toggleAbout()">ABOUT</div>
    </nav>

    <div id="loader"></div>

    <div class="slider-container" id="stage">
        <img src="" class="slide-image" id="mainImage" alt="Portfolio Work">
    </div>

    <div class="category-menu">
        <button class="cat-btn active" onclick="changeCategory('product', this)">Product</button>
        <button class="cat-btn" onclick="changeCategory('interior', this)">Interior</button>
        <button class="cat-btn" onclick="changeCategory('corporate', this)">Corporate</button>
    </div>

    <div class="controls">
        <div class="arrow-btn" onclick="prevSlide()">&#8592;</div>
        <div class="counter" id="counter">1 / 22</div>
        <div class="arrow-btn" onclick="nextSlide()">&#8594;</div>
    </div>

    <div class="about-overlay" id="aboutPanel">
        <div class="close-btn" onclick="toggleAbout()">CLOSE</div>
        <img src="profile.jpg" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin-bottom:30px;">
        <h2 style="font-family:'Playfair Display'; margin-bottom:20px;">About Me</h2>
        <p style="color:#555; line-height:1.6; font-size:0.95rem; margin-bottom:30px;">
            More than a photographer, I am a visual artist dedicated to translating concepts into tangible imagery.<br><br>
            A graduate of MIT WPU, applying technical precision to high-impact commercial visuals.
        </p>
        <div>
            <div><b>Phone:</b> <a href="tel:+918888248590" style="color:inherit; text-decoration:none;">+91 88882 48590</a></div>
            <div style="margin-top:5px;"><b>Email:</b> <a href="mailto:raghavkulkarniphotography@gmail.com" style="color:inherit; text-decoration:none;">raghav@gmail.com</a></div>
        </div>
    </div>

    <script>
        // --- DATA ---
        function generatePaths(prefix, count) {
            var paths = [];
            for (var i = 1; i <= count; i++) { paths.push(prefix + i + ".webp"); }
            return paths;
        }
        const portfolioData = {
            product: generatePaths('product', 22),   
            interior: generatePaths('interior', 12), 
            corporate: generatePaths('corporate', 6) 
        };

        // --- STATE ---
        let currentCat = 'product';
        let currentIndex = 0;
        let images = [];

        // --- INIT ---
        window.onload = function() {
            loadCategory('product');
        };

        // --- LOGIC ---
        function loadCategory(cat) {
            currentCat = cat;
            currentIndex = 0;
            images = portfolioData[cat];
            updateDisplay();
        }

        function changeCategory(cat, btn) {
            // UI Update
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Logic Update
            loadCategory(cat);
        }

        function updateDisplay() {
            const imgEl = document.getElementById('mainImage');
            const counter = document.getElementById('counter');
            const loader = document.getElementById('loader');
            
            // fade out old
            imgEl.classList.remove('active');
            loader.style.display = 'block';

            // Swap Source
            setTimeout(() => {
                imgEl.src = images[currentIndex];
                
                // Preload Next Image (Magic Trick for Speed)
                if(currentIndex < images.length - 1) {
                    new Image().src = images[currentIndex + 1];
                }

                imgEl.onload = function() {
                    loader.style.display = 'none';
                    imgEl.classList.add('active');
                    document.getElementById('stage').classList.add('visible');
                };
            }, 300);

            // Update Counter
            counter.innerText = (currentIndex + 1) + " / " + images.length;
        }

        function nextSlide() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateDisplay();
            } else {
                // Loop back to start?
                currentIndex = 0;
                updateDisplay();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        }

        function toggleAbout() {
            document.getElementById('aboutPanel').classList.toggle('open');
        }

        // Keyboard Support
        document.addEventListener('keydown', function(e) {
            if(e.key === "ArrowRight") nextSlide();
            if(e.key === "ArrowLeft") prevSlide();
        });

    </script>
</body>
</html>
