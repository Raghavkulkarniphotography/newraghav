<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raghav Kulkarni | The Photo Book</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #00638C;
            --text-main: #222;
            --bg-color: #e0e5ec; /* Neutral background for the "table" */
            --book-width: 500px; /* Adjust book size here */
            --book-height: 700px;
            --ease: cubic-bezier(0.645, 0.045, 0.355, 1); /* Smooth book ease */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            /* Subtle texture for the "table" surface */
            background-image: radial-gradient(#fff 20%, transparent 20%), radial-gradient(#fff 20%, transparent 20%);
            background-color: #e0e5ec; background-position: 0 0, 10px 10px; background-size: 20px 20px;
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* --- THE 3D SCENE --- */
        .scene {
            width: var(--book-width);
            height: var(--book-height);
            perspective: 2000px; /* Creates the 3D depth */
            /* Shift center slightly when open to keep it balanced */
            transition: transform 1s var(--ease);
        }
        body.book-open .scene { transform: translateX(250px); } /* Move right half width */

        /* --- THE BOOK CONTAINER --- */
        .book {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d; /* Essential for 3D children */
        }

        /* --- GENERIC PAGE STYLES --- */
        .page {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            transform-origin: left center; /* The "Hinge" of the book */
            transform-style: preserve-3d;
            transition: transform 1.2s var(--ease), box-shadow 0.6s;
            background: #fff;
            box-shadow: inset -3px 0px 20px rgba(0,0,0,0.1); /* Spine shadow */
        }

        /* Front and Back faces of a single page */
        .front, .back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            backface-visibility: hidden; /* Hide the side facing away */
            background: #fff;
            overflow: hidden;
        }
        .back { transform: rotateY(180deg); } /* Back face points backwards initially */

        /* --- 1. THE COVER --- */
        #coverPage {
            z-index: 100;
            cursor: pointer;
            /* Subtle leather texture/color */
            background: #f4f4f4;
        }
        #coverPage .front {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 60px;
            border: 10px solid #fff; outline: 1px solid #ddd; /* Frame look */
        }
        #coverPage.flipped { transform: rotateY(-180deg); z-index: 1; /* Move to bottom of stack when open */ }

        .cover-logo { max-width: 60%; margin-bottom: 40px; }
        .cover-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #444; letter-spacing: 2px; }
        .click-hint { margin-top: 30px; font-size: 0.8rem; color: var(--brand-blue); text-transform: uppercase; letter-spacing: 2px; animation: pulse 2s infinite; }

        /* --- 2. INSIDE COVER (Left Page - Menu/Bio) --- */
        /* This is the '.back' of the coverPage */
        .inside-cover-content {
            padding: 60px 40px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            border-right: 2px solid #eee; /* The spine fold */
        }
        .nav-logo { width: 50px; margin-bottom: 20px; }
        .menu-btn {
            display: block; background: none; border: none; text-align: left;
            font-family: 'Inter', sans-serif; font-size: 1.1rem; color: #999;
            margin-bottom: 15px; cursor: pointer; transition: color 0.3s;
        }
        .menu-btn:hover, .menu-btn.active { color: var(--brand-blue); font-weight: 600; }
        .bio-text { font-size: 0.85rem; color: #666; line-height: 1.6; margin-top: 30px; }

        /* --- 3. PHOTO PAGES (Right Pages) --- */
        .photo-page {
            /* Pages stack depending on index. JS handles z-index */
        }
        .photo-page.flipped { transform: rotateY(-180deg); }

        /* The image on the front of a photo page */
        .photo-container {
            width: 100%; height: 100%; padding: 40px;
            display: flex; justify-content: center; align-items: center;
        }
        .page-img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; /* Do not crop */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); /* Subtle shadow on paper */
        }

        /* --- CONTROLS --- */
        .controls-container {
            position: absolute; bottom: -80px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.5s;
        }
        body.book-open .controls-container { opacity: 1; pointer-events: auto; }

        .ctrl-btn {
            background: #fff; border: none; padding: 15px 30px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s;
        }
        .ctrl-btn:hover { background: var(--brand-blue); color: #fff; transform: translateY(-3px); }
        .page-counter { font-family: 'Playfair Display'; font-size: 1.1rem; line-height: 50px; }

        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        /* Mobile Responsiveness - Scaling the whole scene down */
        @media (max-width: 1024px) { :root { --book-width: 400px; --book-height: 600px; } }
        @media (max-width: 768px) { 
            :root { --book-width: 350px; --book-height: 500px; } 
            body.book-open .scene { transform: translateX(175px); }
            .inside-cover-content { padding: 30px 20px; }
            .menu-btn { font-size: 1rem; }
            .bio-text { display: none; /* Hide bio on small screens to fit menu */ }
        }
        @media (max-width: 480px) { 
             :root { --book-width: 300px; --book-height: 450px; }
             body.book-open .scene { transform: translateX(150px); }
        }

    </style>
</head>
<body>

    <div class="scene" id="bookScene">
        <div class="book" id="theBook">

            <div class="page" id="coverPage" onclick="openBook()">
                <div class="front">
                    <img src="logo.png" alt="Logo" class="cover-logo">
                    <div class="cover-title">RAGHAV KULKARNI</div>
                    <div style="font-size: 0.9rem; margin-top: 10px; color: #666;">PORTFOLIO EDITION</div>
                    <div class="click-hint">Tap to Open</div>
                </div>
                <div class="back">
                    <div class="inside-cover-content">
                        <div>
                            <img src="cornerlogo.png" class="nav-logo">
                            <button class="menu-btn active" onclick="loadCategory('product', this)">Product & Jewelry</button>
                            <button class="menu-btn" onclick="loadCategory('interior', this)">Interior Media</button>
                            <button class="menu-btn" onclick="loadCategory('corporate', this)">Corporate Work</button>
                        </div>
                        <div class="bio-text">
                            <b>Visual Artist</b><br>
                            Translating concepts into tangible imagery through light, composition, and technical precision. Based in Pune.
                        </div>
                    </div>
                </div>
            </div>

            <div id="pagesContainer"></div>

        </div>
    </div>

    <div class="controls-container">
        <button class="ctrl-btn" onclick="prevPage()">PREV</button>
        <div class="page-counter" id="counter"></div>
        <button class="ctrl-btn" onclick="nextPage()">NEXT</button>
    </div>


    <script>
        // --- DATA ---
        function generatePaths(prefix, count) {
            var paths = [];
            for (var i = 1; i <= count; i++) { paths.push(prefix + i + ".webp"); }
            return paths;
        }
        const portfolioData = {
            product: generatePaths('product', 22),   
            interior: generatePaths('interior', 12), 
            corporate: generatePaths('corporate', 6) 
        };

        // --- STATE ---
        let currentImages = [];
        let currentPageIndex = -1; // -1 means cover is closed

        // --- 1. OPEN THE BOOK ---
        function openBook() {
            document.body.classList.add('book-open');
            document.getElementById('coverPage').classList.add('flipped');
            currentPageIndex = 0; // Start at first photo
            
            // Load default category if not already loaded
            if(currentImages.length === 0) loadCategory('product');
            
            updateZIndexes();
        }

        // --- 2. LOAD CATEGORY (Generates Pages) ---
        function loadCategory(cat, btn) {
            if(btn) {
                document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            currentImages = portfolioData[cat];
            currentPageIndex = 0;
            
            const container = document.getElementById('pagesContainer');
            container.innerHTML = ''; // Clear existing pages

            // Create Page Elements in Reverse Order (so index 0 is on top)
            for (let i = currentImages.length - 1; i >= 0; i--) {
                const page = document.createElement('div');
                // Index 0 is the highest Z, subsequent pages are lower
                let zIndex = 50 - i; 
                page.className = 'page photo-page';
                page.id = 'page-' + i;
                page.style.zIndex = zIndex; 
                
                page.innerHTML = `
                    <div class="front">
                        <div class="photo-container">
                            <img src="${currentImages[i]}" class="page-img" loading="lazy">
                        </div>
                    </div>
                    <div class="back">
                        <div style="width:100%; height:100%; background:#f8f8f8;"></div>
                    </div>
                `;
                container.appendChild(page);
            }
            updateCounter();
            updateZIndexes();
        }

        // --- 3. FLIP NAVIGATION ---
        function nextPage() {
            if (currentPageIndex < currentImages.length - 1) {
                // Flip the current page to the left
                document.getElementById('page-' + currentPageIndex).classList.add('flipped');
                currentPageIndex++;
                updateZIndexes();
                updateCounter();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                // Flip the previous page back to the right
                document.getElementById('page-' + currentPageIndex).classList.remove('flipped');
                updateZIndexes();
                updateCounter();
            }
        }

        // --- HELPER: MANAGE Z-INDEX FOR REALISM ---
        function updateZIndexes() {
            // The cover needs to drop below the flipped pages
            const cover = document.getElementById('coverPage');
            if(currentPageIndex > -1) {
                 // If we are deep in the book, cover z-index must be lower than flipped pages
                 cover.style.zIndex = 1;
            } else {
                 cover.style.zIndex = 100;
            }

            // Manage photo pages
            currentImages.forEach((_, i) => {
                const page = document.getElementById('page-' + i);
                if (i < currentPageIndex) {
                    // Flipped pages stack on the left (higher index is on top of stack)
                    page.style.zIndex = 20 + i; 
                } else {
                    // Unflipped pages stack on the right (lower index is on top of stack)
                    page.style.zIndex = 50 - i;
                }
            });
        }

        function updateCounter() {
            if(currentPageIndex > -1) {
                 document.getElementById('counter').innerText = (currentPageIndex + 1) + " / " + currentImages.length;
            }
        }

        // Keyboard Arrows
        document.addEventListener('keydown', (e) => {
            if(document.body.classList.contains('book-open')) {
                if(e.key === "ArrowRight") nextPage();
                if(e.key === "ArrowLeft") prevPage();
            }
        });

    </script>
</body>
</html>
